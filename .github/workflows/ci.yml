# Builds the toolchain (scripts/build.sh), packs the Linux archive
# (scripts/dist.sh, the rx-clang-x86_64-linux artifact) and tests it on
# Ubuntu 22.04 and Debian 12 (scripts/check-dist.sh).
#
# build/install is cached under a key made of the llvm-project commit and
# the build script, so a change to anything else (the scripts that pack or
# test, the README) goes straight to packing. A new llvm-project commit
# rebuilds it; ccache keeps the objects of the last build, so only what the
# new commit changed is compiled again.
#
# Everything runs on ubuntu-22.04 (glibc 2.35), as rx-rust's CI does, so
# the archive runs on Ubuntu 22.04, Debian 12 and later.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump to rebuild build/install (e.g. after changing what dist.sh expects).
  CACHE_VERSION: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  # Whether llvm-project is still rx-rust main's (a notice, not a failure:
  # a bump is a pull request of its own, scripts/update-llvm.sh).
  llvm-pin:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/update-llvm.sh --check main ||
            echo "::warning::llvm-project is not rx-rust main's LLVM: scripts/update-llvm.sh"

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: |
          echo "install=install-linux-v$CACHE_VERSION-$(git rev-parse HEAD:llvm-project)-${{ hashFiles('scripts/build.sh') }}" |
            tee -a "$GITHUB_OUTPUT"
      - id: install
        uses: actions/cache/restore@v6
        with: { path: build/ci/install.tar.zst, key: "${{ steps.key.outputs.install }}" }
      # dist.sh needs the checkout too (LICENSE.TXT, the commit).
      - run: git submodule update --init --depth 1 llvm-project
      - if: steps.install.outputs.cache-hit != 'true'
        name: Install build tools
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build ccache python3 g++ zstd > /dev/null
      - if: steps.install.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-
      - if: steps.install.outputs.cache-hit != 'true'
        run: |
          bash scripts/build.sh
          ccache -s
          mkdir -p build/ci
          tar -C build -cf - install | zstd -q -T0 -9 -o build/ci/install.tar.zst
      - if: steps.install.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with: { path: build/ci/install.tar.zst, key: "${{ steps.key.outputs.install }}" }
      - if: always() && steps.install.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-linux-${{ github.run_id }}
      - if: steps.install.outputs.cache-hit == 'true'
        run: zstd -q -d -c build/ci/install.tar.zst | tar -C build -xf -
      - run: bash scripts/dist.sh
      # The archive must not need a newer glibc than the runner's.
      - run: |
          tar -xJOf build/dist/rx-clang-x86_64-linux.tar.xz rx-clang-x86_64-linux/VERSIONS |
            grep -x 'needs glibc    2\.3[0-5] or later'
      - uses: actions/upload-artifact@v7
        with:
          name: rx-clang-x86_64-linux
          path: |
            build/dist/rx-clang-x86_64-linux.tar.xz
            build/dist/rx-clang-x86_64-linux.spdx.json
            build/dist/rx-clang-x86_64-linux.cdx.json
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-linux
          path: build/llvm/*.log
          if-no-files-found: ignore

  # The archive on other distributions, with nothing installed but what
  # unpacking needs (no compiler): scripts/check-dist.sh builds test/ with
  # the archive's programs and runs it on the qemu-system-rx of the rx-rust
  # release in .github/rx-rust-release.
  linux-check:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12"]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ${{ matrix.image }}
    steps:
      # The container gets the runner's DNS servers, which stopped resolving
      # the Ubuntu archive hosts for hours on 2026-11-11 (rx-rust's ci.yml).
      # If the install fails or hangs, use public DNS servers and try again.
      - run: |
          apt_install() {
            timeout -k 30 300 apt-get update -qq &&
              timeout -k 30 600 apt-get install -y -qq -o Acquire::Retries=3 \
                --no-install-recommends ca-certificates curl xz-utils zstd > /dev/null
          }
          apt_install || {
            echo "apt-get install failed or timed out: retrying with public DNS" >&2
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
            apt_install
          }
      - uses: actions/checkout@v7
      - id: rel
        run: echo "tag=$(grep -v '^#' .github/rx-rust-release)" | tee -a "$GITHUB_OUTPUT"
      - id: qemu
        uses: actions/cache@v6
        with:
          path: rx-rust/rx-toolchain-x86_64-linux.tar.xz
          key: rx-rust-${{ steps.rel.outputs.tag }}-linux
      - if: steps.qemu.outputs.cache-hit != 'true'
        run: |
          mkdir -p rx-rust
          curl -fsSL --retry 3 -o rx-rust/rx-toolchain-x86_64-linux.tar.xz \
            "https://github.com/CDEF-inc/rx-rust/releases/download/${{ steps.rel.outputs.tag }}/rx-toolchain-x86_64-linux.tar.xz"
      - uses: actions/download-artifact@v8
        with:
          name: rx-clang-x86_64-linux
          path: dist
      - run: bash scripts/check-dist.sh dist/rx-clang-x86_64-linux.tar.xz rx-rust/rx-toolchain-x86_64-linux.tar.xz
